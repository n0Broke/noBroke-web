<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | noBroke</title>
    <link rel="shortcut icon" href="../assets/imgs-logo-nobroke/noBroke-menor-sem-fundo.png" type="image/x-icon">

    <script src="./js/sessao.js"></script>
    <script>
        (function () {
            const modo = sessionStorage.getItem("MODO");

            if (modo == 1) {
                document.documentElement.style.setProperty('--preto', '#F2F2F2');
                document.documentElement.style.setProperty('--branco', '#000');
                document.documentElement.style.setProperty('--pretoClaro', '#fff');
                document.documentElement.style.setProperty('--brancoCinza', '#1D2025');
                document.documentElement.style.setProperty('--bordas', '#b5b5b5');
            }
        })();
    </script>

    <link rel="stylesheet" href="../css/richard.css">
    <link rel="stylesheet" href="../css/dashResponsivo.css">

    <link rel="icon" href="./assets/imgs-logo-nobroke/noBroke-menor-sem-fundo.png">

    <!-- Importar o Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body onload="verificarModo()">
    <div class="containerPai">
        <div class="sidebar" id="div_lateralAberta">
            <div class="botao-fechar" style="display: none;" onclick="fecharAbrirLateral()">
                <span>X</span>
            </div>
            <div class="logo-container">
                <img id="imgLogo" class="logo-dash img" src="../assets/imgs-logo-nobroke/noBroke-oficial-sem-fundo.png">
            </div>
            <!-- Side Bar - Botões -->
            <div class="menu_centro">
                <!-- Sidebar - Parte 01 -->
                <div class="menu01">
                    <h4 class="titulo_sidebar">PRINCIPAL</h4>
                    <!-- Página atual -->
                    <button class="btn-nobroke btn-active">
                        <span class="icon">
                            <img id="iconAtual" src="../assets/icon/icons-dashboard/painel-de-controle-hover.png">
                        </span>
                        <span class="texto">Dashboard</span>
                    </button>

                    <a href="servidores.html" class="btn-nobroke">
                        <span class="icon">
                            <img src="../assets/icon/icons-dashboard/servidores-de-hospedagem.png">
                        </span>
                        <span class="texto">Servidores</span>
                    </a>

                    <a href="Alertas.html" class="btn-nobroke">
                        <span class="icon">
                            <img src="../assets/icon/icons-dashboard/notificacao.png">
                        </span>
                        <span class="texto">Alertas</span>
                    </a>

                    <div id="div_relatorios">
                        <a href="Relatorios.html" class="btn-nobroke">
                            <span class="icon">
                                <img src="../assets/icon/icons-dashboard/grafico-de-barras.png">
                            </span>
                            <span class="texto">Relatórios</span>
                        </a>
                    </div>

                    <a href="monitoramento.html" class="btn-nobroke">
                        <span class="icon">
                            <img src="../assets/icon/icons-dashboard/heart-rate.png">
                        </span>
                        <span class="texto">Monitoramento</span>
                    </a>
                </div>
                <!-- ============================ -->
                <div class="menu02">
                    <h4 class="titulo_sidebar">ADMINISTRAÇÃO</h4>

                    <a href="Configurações.html" class="btn-nobroke">
                        <span class="icon">
                            <img src="../assets/icon/icons-dashboard/config.png">
                        </span>
                        <span class="texto">Configurações</span>
                    </a>

                    <a href="suporte.html" class="btn-nobroke">
                        <span class="icon">
                            <img src="../assets/icon/icons-dashboard/ponto-de-interrogacao.png">
                        </span>
                        <span class="texto">Suporte</span>
                    </a>
                </div>
                <!-- Fim dos Menus -->
                <!-- ================================================================= -->
                <!-- Parte do perfil -->
            </div>
            <div class="user-profile" onclick="window.location.href = 'Configurações.html?aba=perfil'">
                <div class="profile-img">
                    <img id="imgUser" src="../assets/icon/user-circle-svgrepo-com.svg" alt="Foto de perfil">
                </div>
                <div class="user-infos">
                    <p class="username" id="usuario" style="color: var(--branco);">Douglas</p>
                    <span class="cargo" id="cargoFunc" style="color: var(--branco);">Gerente de Infra</span>
                </div>
            </div>
        </div>
        <!-- ================================================================= -->

        <div class="conteudo-dash" id="telaPrincipal">
            <!-- Header do Conteudo da Dashboard -->
            <div class="header-responsividade">
                <div class="qualTela">
                    <img src="../assets/svg/window-frame-svgrepo-com.svg" alt="dashboard-icon"
                        style="width: 30px; cursor: pointer; color: var(--cinzaClaro);" onclick="fecharAbrirLateral()">
                    <a href="dashboard.html">&nbsp;Dashboard >&nbsp;</a>
                    <span style="color: var(--branco);">Latência de Rede</span>
                </div>
                <div id="iconeModo">
                    <img id="imgModo" src="../assets/icon/icons-dashboard/brilho-do-sol.png"
                        style="width: 40px; cursor: pointer; margin-right: 20px;">
                </div>
            </div>
            <div class="header-conteudo-dash">
                <div class="header-esquerdo" style="flex-direction: row;">
                    <div class="header-esquerdo01">
                        <img src="../assets/richard/hierarchy-circle-svgrepo-com.svg" alt="">
                    </div>
                    <div class="header-esquerdo02" style="flex-direction: column;">
                        <h2>Latência de Rede</h2>
                        <p>Servidor 01</p>
                    </div>
                </div>
                <div class="header-direita">
                    <button class="" onclick="window.location.reload()">
                        <img id="logoAlerta" src="../assets/richard/arrow-u-down-left-svgrepo-com.svg" alt="" style="width: 16px; color: white;">
                        <span>&nbsp;Voltar</span></button>
                </div>
            </div>
            <!-- ========================================================= -->
            
        </div>
    </div>
    <div class="card-alertaGeral" id="div_alertaGeral">
    </div>
</body>

</html>
<script>
    const limiteCPU = 15;
    const root = document.documentElement;
    const imgModo = document.getElementById("imgModo");
    const imgLogo = document.getElementById("imgLogo");
    const imgUser = document.getElementById("imgUser");
    const sidebar = document.getElementById("div_lateralAberta");
    const cardAlerta = document.getElementById("div_alertaGeral")
    const corPreto = ('--preto')
    const corBranca = ('--branco')

    let modoEscuro = false;

    imgModo.addEventListener("click", mudarModo);

    function fecharAbrirLateral() {
        const conteudo = document.getElementById("telaPrincipal");

        sidebar.classList.toggle("compacta");
        conteudo.classList.toggle("expandido");

        if (sidebar.classList.contains("compacta")) {
            sessionStorage.LATERAL = 1;
            if (modoEscuro) {
                imgLogo.src = "../assets/imgs-logo-nobroke/logo-menor-preto.png"
            } else {
                imgLogo.src = "../assets/imgs-logo-nobroke/noBroke-menor-sem-fundo.png"
            }
        } else {
            sessionStorage.LATERAL = 0;
            if (modoEscuro) {
                imgLogo.src = "../assets/imgs-logo-nobroke/logoPreto.png";
            } else {
                imgLogo.src = "../assets/imgs-logo-nobroke/noBroke-oficial-sem-fundo.png";
            }
        }
    }

    // Alterna entre modo claro e escuro, atualizando:
    // Variáveis CSS (cores)
    // Ícones (modo, usuário, logo)
    // Estado salvo no sessionStorage
    function mudarModo() {
        modoEscuro = !modoEscuro;

        if (modoEscuro) {
            sessionStorage.MODO = 1;
            root.style.setProperty('--preto', '#F2F2F2');
            root.style.setProperty('--branco', '#000');
            root.style.setProperty('--pretoClaro', '#fff');
            root.style.setProperty('--brancoCinza', '#1D2025');
            root.style.setProperty('--bordas', '#b5b5b5');
            imgModo.src = "../assets/icon/icons-dashboard/lua-crescente.png";
            imgUser.src = "../assets/icon/user-circle-svgrepo-com-preto.svg";
            // Atualiza a logo dependendo do modo (claro/escuro) e do estado da sidebar (compacta ou expandida)
            if (sidebar.classList.contains("compacta")) {
                if (modoEscuro) {
                    imgLogo.src = "../assets/imgs-logo-nobroke/logo-menor-preto.png"
                } else {
                    imgLogo.src = "../assets/imgs-logo-nobroke/noBroke-menor-sem-fundo.png"
                }
            } else {
                if (modoEscuro) {
                    imgLogo.src = "../assets/imgs-logo-nobroke/logoPreto.png";
                } else {
                    imgLogo.src = "../assets/imgs-logo-nobroke/noBroke-oficial-sem-fundo.png";
                }
            }
        } else {
            // MODO: 0 = claro | 1 = escuro
            // LATERAL: 0 = expandida | 1 = compacta
            // ALERTA: controla exibição do card de alerta
            sessionStorage.MODO = 0;
            root.style.setProperty('--branco', '#fff');
            root.style.setProperty('--preto', '#000');
            root.style.setProperty('--pretoClaro', '#1D2025');
            root.style.setProperty('--brancoCinza', '#b5b5b5');
            root.style.setProperty('--bordas', '#3a3f45');
            imgModo.src = "../assets/icon/icons-dashboard/brilho-do-sol.png";
            imgUser.src = "../assets/icon/user-circle-svgrepo-com.svg";
            if (sidebar.classList.contains("compacta")) {
                if (modoEscuro) {
                    imgLogo.src = "../assets/imgs-logo-nobroke/logo-menor-preto.png"
                } else {
                    imgLogo.src = "../assets/imgs-logo-nobroke/noBroke-menor-sem-fundo.png"
                }
            } else {
                if (modoEscuro) {
                    imgLogo.src = "../assets/imgs-logo-nobroke/logoPreto.png";
                } else {
                    imgLogo.src = "../assets/imgs-logo-nobroke/noBroke-oficial-sem-fundo.png";
                }
            }
        }
    }

    // Inicializa o estado da dashboard com base no sessionStorage:
    function verificarModo() {
        // Aplica modo (claro/escuro)
        if (sessionStorage.MODO == 1) {
            mudarModo()
        }
        // Define estado da sidebar
        if (sessionStorage.LATERAL == 1) {
            fecharAbrirLateral()
        }
        // Controla exibição de alertas
        if (sessionStorage.ALERTA == 0) {
            cardAlerta.style.display = "none"
        } else {
            cardAlerta.innerHTML = `<div class="box-cardAlerta">
                    <div class="titulo-pai">
                        <div class="titulo-alerta">
                            <img src="../assets/svg/alertas/warning.png">
                            <span>ALERTA</span>
                        </div>
                        <div class="fecharCard">
                            <span onclick="fecharAlerta()">X</span>
                        </div>
                    </div>
                    <div class="corpo-alerta">
                        <span>2 Alertas Críticos</span>
                        <a href="Alertas.html">Clique aqui para ver mais informações!</a>
                    </div>
                </div>`
        }
        // Ajusta permissões de acesso (relatórios)
        if (sessionStorage.FK_FUNCAO != 1) {
            const divRelatorios = document.getElementById("div_relatorios");
            divRelatorios.style.display = "none";
            sessionStorage.FUNCAO = "Analista de Infra";
        } else {
            sessionStorage.FUNCAO = "Gestor de Infra";
        }
    }

    // Fecha o card de alerta
    function fecharAlerta() {
        cardAlerta.style.display = "none"
    }
    // =======================================================
    // Abaixo função de carregar as redes e adversos
</script>
